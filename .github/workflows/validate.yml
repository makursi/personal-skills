name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装校验依赖
        run: python -m pip install --upgrade pip pyyaml

      - name: 校验 skill 结构
        run: python scripts/validate-skills.py

      - name: 校验 README 检查脚本
        run: python skills/write-readme/scripts/test-check-readme.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 冒烟可发现性（只读）
        run: npx -y skills@1.9.0 add . --list
